<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="theme-color" content="#070c1a"/>
    <title>Find 360 - Property Details</title>
    <link rel="manifest" href="manifest.json"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css"/>
    <script src="supabase-js.js"></script>
    <script src="supabase-config.js?v=6"></script>
    <style>
        .detail-page { max-width: 800px; margin: 0 auto; padding: 20px; }
        .detail-carousel { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden; background: #141c30; margin-bottom: 24px; }
        .detail-carousel .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.6s ease; }
        .detail-carousel .slide.active { opacity: 1; }
        .detail-carousel .dots { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .detail-carousel .dots .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.3); cursor: pointer; transition: 0.3s; }
        .detail-carousel .dots .dot.active { background: #2dd4bf; border-color: #2dd4bf; transform: scale(1.2); }
        .detail-title { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .detail-price { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 16px; }
        .detail-desc { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .detail-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
        .detail-meta span { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); background: var(--card); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); }
        .detail-meta .material-symbols-outlined { font-size: 18px; color: var(--primary); }
        .owner-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
        .owner-card h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .owner-card h3 .material-symbols-outlined { color: var(--primary); }
        .owner-field { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
        .owner-field:last-child { border-bottom: none; }
        .owner-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .owner-value { font-size: 15px; font-weight: 500; color: var(--text); }
        .masked-info { position: relative; }
        .masked-info .lock-overlay { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; font-size: 12px; font-weight: 600; padding: 8px 16px; border-radius: 10px; cursor: pointer; border: none; transition: 0.2s; }
        .masked-info .lock-overlay:hover { transform: scale(1.03); filter: brightness(1.1); }
        .masked-info .lock-overlay .material-symbols-outlined { font-size: 16px; }
        .masked-info .hidden-value { filter: blur(6px); user-select: none; pointer-events: none; color: var(--muted); }
        .masked-info.revealed .hidden-value { filter: none; user-select: auto; pointer-events: auto; color: var(--text); }
        .masked-info.revealed .lock-overlay { display: none; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }
        .sub-banner { background: linear-gradient(135deg, #1e3a5f, #1e40af); border: 1px solid #3b82f6; border-radius: 12px; padding: 16px 20px; margin-top: 16px; text-align: center; }
        .sub-banner p { color: #93c5fd; font-size: 13px; margin-bottom: 10px; }
        .sub-banner .btn-sub { background: #3b82f6; color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .sub-banner .btn-sub:hover { background: #2563eb; }
        .no-property { text-align: center; padding: 80px 20px; color: var(--muted); }
        .no-property .material-symbols-outlined { font-size: 64px; margin-bottom: 12px; display: block; }

        /* Payment Modal */
        .pay-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.2s ease;
        }
        .pay-box {
            background: #0f1626; border: 1px solid #222c44;
            border-radius: 20px; width: 100%; max-width: 400px;
            max-height: 90vh; overflow-y: auto; position: relative; padding: 28px;
        }
        .pay-close {
            position: absolute; top: 14px; right: 14px;
            background: rgba(255,255,255,0.06); border: 1px solid #222c44;
            border-radius: 50%; width: 34px; height: 34px;
            display: grid; place-items: center; cursor: pointer; color: #94a3b8;
        }
        .pay-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .pay-head { text-align: center; margin-bottom: 24px; }
        .pay-head-icon { font-size: 44px; color: #14b8a6; display: block; margin-bottom: 8px; }
        .pay-head h2 { font-size: 22px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
        .pay-head p { font-size: 13px; color: #94a3b8; }
        .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .pay-method {
            background: rgba(255,255,255,0.03); border: 2px solid #222c44;
            border-radius: 14px; padding: 20px 12px; text-align: center;
            cursor: pointer; transition: 0.2s; color: #e2e8f0;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            font-size: 14px; font-weight: 600;
        }
        .pay-method:hover { border-color: #14b8a6; transform: translateY(-3px); background: rgba(20,184,166,0.06); }
        .pay-logo-box { width: 52px; height: 52px; display: grid; place-items: center; }
        .gw-loading { text-align: center; padding: 30px 0; }
        .gw-spinner { width: 56px; height: 56px; border: 4px solid #222c44; border-top-color: #14b8a6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .gw-loading h3 { font-size: 18px; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
        .gw-loading p { font-size: 13px; color: #94a3b8; }
        .gw-success { text-align: center; padding: 30px 0; }
        .gw-check .material-symbols-outlined { font-size: 64px; color: #22c55e; animation: popIn 0.4s ease; }
        .gw-success h3 { font-size: 20px; font-weight: 700; color: #e2e8f0; margin: 12px 0 6px; }
        .gw-success p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        .pay-confirm-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #14b8a6, #0d9488); color: #04211c; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .pay-confirm-btn:hover { filter: brightness(1.1); }
    </style>
</head>

        function formatPrice(n) {
            if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
            if (n >= 100000) return '₹' + (n / 100000).toFixed(1).replace(/\.0$/, '') + ' L';
            return '₹' + n.toLocaleString('en-IN');
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function loadProperty() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { showNotFound(); return; }

            let prop = null;

            if (String(id).startsWith('demo-')) {
                prop = DEMO.find(p => p.id === id);
            } else {
                try {
                    const { data, error } = await supabase
                        .from('properties')
                        .select('*')
                        .eq('id', id)
                        .single();
                    if (!error && data) prop = data;
                } catch (e) {}
            }

            if (!prop) { showNotFound(); return; }
            renderDetail(prop);
        }

        function showNotFound() {
            document.getElementById('detail-content').innerHTML = `
                <div class="no-property">
                    <span class="material-symbols-outlined">search_off</span>
                    <p>Property not found.</p>
                </div>`;
        }

        function renderDetail(p) {
            document.title = 'Find 360 - ' + p.title;

            let carouselHtml = '';
            if (p.image_urls && p.image_urls.length > 1) {
                const slides = p.image_urls.map((url, i) => `<img class="slide${i === 0 ? ' active' : ''}" src="${esc(url)}" alt="${esc(p.title)}"/>`).join('');
                const dots = p.image_urls.map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}" data-i="${i}"></span>`).join('');
                carouselHtml = `<div class="detail-carousel" data-cur="0">${slides}<div class="dots">${dots}</div></div>`;
            } else if (p.image_urls && p.image_urls.length === 1) {
                carouselHtml = `<div class="detail-carousel"><img class="slide active" src="${esc(p.image_urls[0])}" alt="${esc(p.title)}"/></div>`;
            } else {
                carouselHtml = `<div class="detail-carousel" style="display:grid;place-items:center;"><span class="material-symbols-outlined" style="font-size:64px;color:#3d4a68;">home</span></div>`;
            }

            const verified = p.verified ? '<span style="color:#2dd4bf;font-size:13px;font-weight:600;">✓ Verified</span>' : '';

            const ownerName = p.owner_name || 'Not available';

            const html = `
                ${carouselHtml}
                <div class="detail-price">${formatPrice(p.price)}</div>
                <div class="detail-title">${esc(p.title)} ${verified}</div>
                <div class="detail-desc">${esc(p.description || '')}</div>
                <div class="detail-meta">
                    <span><span class="material-symbols-outlined">category</span>${esc(p.property_type || '—')}</span>
                    <span><span class="material-symbols-outlined">bed</span>${esc(p.bhk || '—')}</span>
                    ${p.location ? `<span><span class="material-symbols-outlined">location_on</span>${esc(p.location)}</span>` : ''}
                </div>
                <div class="owner-card">
                    <h3><span class="material-symbols-outlined">person</span>Owner Details</h3>
                    <div class="owner-field">
                        <span class="owner-label">Name</span>
                        <span class="owner-value">${esc(ownerName)}</span>
                    </div>
                    <div class="owner-field">
                        <span class="owner-label">Email</span>
                        <div class="masked-info" id="masked-email">
                            <span class="hidden-value">${esc(p.owner_email || 'xxxx@xxxx.com')}</span>
                            <button class="lock-overlay" onclick="showSubscribe()">
                                <span class="material-symbols-outlined">lock</span>Subscribe to view
                            </button>
                        </div>
                    </div>
                    <div class="owner-field">
                        <span class="owner-label">Mobile</span>
                        <div class="masked-info" id="masked-mobile">
                            <span class="hidden-value">${esc(p.owner_mobile || '+91 XXXXXXXXXX')}</span>
                            <button class="lock-overlay" onclick="showSubscribe()">
                                <span class="material-symbols-outlined">lock</span>Subscribe to view
                            </button>
                        </div>
                    </div>
                </div>
                <div class="sub-banner">
                    <p>Get full owner contact details with an active subscription</p>
                    <button class="btn-sub" onclick="showSubscribe()">Subscribe Now</button>
                </div>
            `;

            document.getElementById('detail-content').innerHTML = html;
            startDetailCarousel();
        }

        function showSubscribe() {
            const overlay = document.createElement('div');
            overlay.className = 'pay-overlay';
            overlay.id = 'gw-overlay';
            overlay.innerHTML = `
                <div class="pay-box">
                    <button class="pay-close" onclick="closeGateway()"><span class="material-symbols-outlined">close</span></button>
                    <div class="pay-head">
                        <span class="material-symbols-outlined pay-head-icon">payment</span>
                        <h2>Subscribe to View Details</h2>
                        <p>Choose payment method</p>
                    </div>
                    <div class="pay-grid" id="gw-methods">
                        <button class="pay-method" onclick="startGateway('paytm')">
                            <div class="pay-logo-box paytm-box"><svg viewBox="0 0 48 48" width="40" height="40"><rect width="48" height="48" rx="8" fill="#002970"/><text x="24" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff" font-family="Arial">₹</text></svg></div>
                            <span>Paytm</span>
                        </button>
                        <button class="pay-method" onclick="startGateway('phonepe')">
                            <div class="pay-logo-box phonepe-box"><svg viewBox="0 0 48 48" width="40" height="40"><rect width="48" height="48" rx="8" fill="#5f259f"/><text x="24" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff" font-family="Arial">₹</text></svg></div>
                            <span>PhonePe</span>
                        </button>
                        <button class="pay-method" onclick="startGateway('gpay')">
                            <div class="pay-logo-box gpay-box"><svg viewBox="0 0 48 48" width="40" height="40"><rect width="48" height="48" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/><text x="24" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4285f4" font-family="Arial">G</text></svg></div>
                            <span>Google Pay</span>
                        </button>
                        <button class="pay-method" onclick="startGateway('crypto')">
                            <div class="pay-logo-box crypto-box"><svg viewBox="0 0 48 48" width="40" height="40"><circle cx="24" cy="24" r="24" fill="#f7931a"/><text x="24" y="31" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff" font-family="Arial">₿</text></svg></div>
                            <span>Bitcoin</span>
                        </button>
                    </div>
                    <div class="gw-loading" id="gw-loading" style="display:none;">
                        <div class="gw-spinner"></div>
                        <h3 id="gw-status">Processing payment...</h3>
                        <p id="gw-sub">Please wait while we connect to payment gateway</p>
                    </div>
                    <div class="gw-success" id="gw-success" style="display:none;">
                        <div class="gw-check"><span class="material-symbols-outlined">check_circle</span></div>
                        <h3>Payment Successful!</h3>
                        <p>Your subscription is now active</p>
                        <button class="pay-confirm-btn" onclick="closeGateway()">Done</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function startGateway(method) {
            document.getElementById('gw-methods').style.display = 'none';
            document.getElementById('gw-loading').style.display = 'block';
            const msgs = [
                { t: 'Connecting to ' + method + '...', s: 'Secure connection established' },
                { t: 'Verifying payment of ₹199', s: 'Please wait a moment' },
                { t: 'Processing transaction...', s: 'Almost done' }
            ];
            let i = 0;
            const iv = setInterval(() => {
                if (i < msgs.length) {
                    document.getElementById('gw-status').textContent = msgs[i].t;
                    document.getElementById('gw-sub').textContent = msgs[i].s;
                    i++;
                } else {
                    clearInterval(iv);
                    document.getElementById('gw-loading').style.display = 'none';
                    document.getElementById('gw-success').style.display = 'block';
                    document.getElementById('gw-success').innerHTML = `
                        <div class="gw-check" style="color:#f43f5e;"><span class="material-symbols-outlined">error</span></div>
                        <h3 style="color:#f43f5e;">Payment Failed!</h3>
                        <p>Something went wrong. Please try again.</p>
                        <button class="pay-confirm-btn" onclick="closeGateway()" style="background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;">Try Again</button>
                    `;
                }
            }, 1500);
        }

        function closeGateway() {
            const el = document.getElementById('gw-overlay');
            if (el) el.remove();
            document.body.style.overflow = '';
        }

        function startDetailCarousel() {
            const c = document.querySelector('.detail-carousel');
            if (!c) return;
            const slides = c.querySelectorAll('.slide');
            const dots = c.querySelectorAll('.dot');
            if (slides.length <= 1) return;
            setInterval(() => {
                let cur = parseInt(c.dataset.cur) || 0;
                slides[cur].classList.remove('active');
                dots[cur].classList.remove('active');
                cur = (cur + 1) % slides.length;
                slides[cur].classList.add('active');
                dots[cur].classList.add('active');
                c.dataset.cur = cur;
            }, 2500);
        }

        loadProperty();
    </script>

    <!-- Payment Modal -->
    <div class="pay-overlay" id="pay-modal" style="display:none;" onclick="if(event.target===this)closePayModal()">
        <div class="pay-box">
            <button class="pay-close" onclick="closePayModal()"><span class="material-symbols-outlined">close</span></button>

            <div id="pay-options">
                <div class="pay-head">
                    <span class="material-symbols-outlined pay-head-icon">payment</span>
                    <h2>Choose Payment Method</h2>
                    <p>Select a method to complete subscription</p>

                <div class="pay-grid">
                    <button class="pay-method" onclick="selectPayment('paytm')">

                        </div>
                        <span>Paytm</span>
                    </button>
                    <button class="pay-method" onclick="selectPayment('phonepe')">
                        <div class="pay-logo-box phonepe-box">
                            <svg viewBox="0 0 48 48" width="40" height="40"><rect width="48" height="48" rx="8" fill="#5f259f"/><text x="24" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff" font-family="Arial">₹</text></svg>
                        </div>
                        <span>PhonePe</span>
                    </button>
                    <button class="pay-method" onclick="selectPayment('gpay')">
                        <div class="pay-logo-box gpay-box">
                            <svg viewBox="0 0 48 48" width="40" height="40"><rect width="48" height="48" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/><text x="24" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4285f4" font-family="Arial">G</text></svg>
                        </div>
                        <span>Google Pay</span>
                    </button>
                    <button class="pay-method" onclick="selectPayment('crypto')">
                        <div class="pay-logo-box crypto-box">
                            <svg viewBox="0 0 48 48" width="40" height="40"><circle cx="24" cy="24" r="24" fill="#f7931a"/><text x="24" y="31" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff" font-family="Arial">₿</text></svg>
                        </div>
                        <span>Bitcoin</span>
                    </button>
                </div>
            </div>

            <div id="pay-qr" style="display:none;">
                <div class="pay-head">
                    <span class="material-symbols-outlined pay-head-icon">qr_code_scanner</span>
                    <h2 id="qr-title">Scan to Pay</h2>
                    <p>Scan the QR code to complete payment</p>
                </div>
                <div class="qr-wrap">
                    <img id="qr-img" src="" alt="QR Code"/>
                </div>
                <p class="qr-amount">Amount: <strong>₹199</strong> (Pro Plan)</p>
                <button class="pay-confirm-btn" onclick="confirmPayment()">I've Completed Payment</button>
                <button class="pay-back-btn" onclick="document.getElementById('pay-options').style.display='grid';document.getElementById('pay-qr').style.display='none';">
                    <span class="material-symbols-outlined">arrow_back</span>Back to methods
                </button>
            </div>
        </div>
    </div>
</body>
