<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Outer circle (360 ring) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-dasharray="70 30" opacity="0.9"/>
  <!-- Inner circle (dot) -->
  <circle cx="256" cy="256" r="48" fill="#ffffff"/>
  <!-- 360 text -->
  <text x="256" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="100" font-weight="800" fill="#0d9488" letter-spacing="-4">360</text>
</svg>
