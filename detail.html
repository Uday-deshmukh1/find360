        function formatPrice(n) {
            if (n >= 10000000) return '₹' + (n / 10000000).toFixed(2).replace(/\.?0+$/, '') + ' Cr';
            if (n >= 100000) return '₹' + (n / 100000).toFixed(1).replace(/\.0$/, '') + ' L';
            if (n >= 1000) return '₹' + n.toLocaleString('en-IN');
            return '₹' + n + '/month';
        }

        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function initMap(location) {
            const coords = {

                'VMV Road, Amaravati': [20.9380, 77.7680],
                'Rathi Nagar, Amaravati': [20.9550, 77.7820],
                'Amaravati, India': [20.9517, 77.7606]
            };
            const pos = coords[location] || [20.9517, 77.7606];
            setTimeout(() => {
                const map = L.map('detail-map', { zoomControl: false, attributionControl: false }).setView(pos, 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                L.marker(pos).addTo(map).bindPopup('<b>' + location + '</b>').openPopup();
                setTimeout(() => map.invalidateSize(), 100);
            }, 200);
        }

        function startCarousel() {

            const wrapper = document.getElementById('carouselWrapper');
            if (wrapper) {
                wrapper.addEventListener('mouseenter', () => clearInterval(carouselInterval));
                wrapper.addEventListener('mouseleave', () => {
                    carouselInterval = setInterval(() => { currentSlide = (currentSlide + 1) % totalSlides; updateCarousel(); }, 5000);
                });
            }
        }

            const track = document.getElementById('sliderTrack');
            const num = document.getElementById('currentSlideNum');
            const dots = document.querySelectorAll('.indicator-dot');
            if (track) track.style.transform = `translateX(-${currentSlide * 100}%)`;
            if (num) num.textContent = currentSlide + 1;
            dots.forEach((d, i) => {
                d.className = i === currentSlide
                    ? "w-5 h-1.5 rounded-full bg-primary transition-all duration-300 indicator-dot"
                    : "w-1.5 h-1.5 rounded-full bg-on-surface-variant/50 transition-all duration-300 indicator-dot";

            let i = 0;
            const iv = setInterval(() => {
                if (i < msgs.length) { document.getElementById('gw-status').textContent = msgs[i].t; document.getElementById('gw-sub').textContent = msgs[i].s; i++; }
                else {
                    clearInterval(iv);
                    document.getElementById('gw-loading').style.display = 'none';
                    document.getElementById('gw-success').style.display = 'block';
                    document.getElementById('gw-success').innerHTML = '<div class="gw-check" style="color:#f43f5e;"><span class="material-symbols-outlined">error</span></div><h3 style="color:#f43f5e;">Payment Failed!</h3><p>Something went wrong. Please try again.</p><button class="pay-confirm-btn" onclick="closeGateway()" style="background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;">Try Again</button>';
                }
            }, 1500);
        }

        function closeGateway() { const el = document.getElementById('gw-overlay'); if (el) el.remove(); }

        function shareProperty() {
            const url = window.location.href;
            const title = document.title;
            if (navigator.share) {
                navigator.share({ title: title, url: url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    const toast = document.createElement('div');
                    toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#14b8a6;color:#04211c;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.4);';
                    toast.textContent = 'Link copied!';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                });
            }
        }

        loadProperty();
    </script>
</body>
</html>
